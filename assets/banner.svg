<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#311b92;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#4f46e5;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Grid Overlay -->
  <g opacity="0.1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" stroke="#ffffff" stroke-width="1" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Floating Orbs -->
  <circle cx="150" cy="80" r="60" fill="#38bdf8" opacity="0.25" filter="url(#glow)">
    <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="220" r="80" fill="#c084fc" opacity="0.25" filter="url(#glow)">
    <animate attributeName="cy" values="220;190;220" dur="7s" repeatCount="indefinite" />
  </circle>
  <circle cx="900" cy="70" r="45" fill="#818cf8" opacity="0.2" filter="url(#glow)">
    <animate attributeName="cx" values="900;930;900" dur="8s" repeatCount="indefinite" />
  </circle>

  <!-- Content Banner Container -->
  <g text-anchor="middle">
    <!-- Graduation Cap / Learning Icon -->
    <g transform="translate(600, 75)">
      <path d="M-40 0 L0 -20 L40 0 L0 20 Z" fill="url(#accentGrad)" filter="url(#glow)" />
      <path d="M-25 9 V22 C-25 30 25 30 25 22 V9" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
      <path d="M30 3 V30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <circle cx="30" cy="33" r="4" fill="#38bdf8" />
    </g>

    <!-- Main Title -->
    <text x="600" y="155" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" letter-spacing="1">
      AWESOME LEARNING MANAGEMENT SYSTEMS
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="2">
      TOP LMS PLATFORMS • SAAS • OPEN-SOURCE • EDTECH ECOSYSTEM
    </text>

    <!-- Decorative Badges in Banner -->
    <g transform="translate(600, 240)">
      <rect x="-180" y="-18" width="110" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="-125" y="1" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">🎓 EDTECH</text>

      <rect x="-55" y="-18" width="110" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <text x="0" y="1" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">⚡ SAAS</text>

      <rect x="70" y="-18" width="110" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
      <text x="125" y="1" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">💻 OPEN SOURCE</text>
    </g>
  </g>
</svg>
